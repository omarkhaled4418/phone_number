plugins {
    id 'com.android.application'
}

android {
    namespace 'com.contactsbackup.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.contactsbackup.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "ContactsBackup.apk"
        }
    }
}

// Automatically copy built APK to download-page and docs folders
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug' || task.name == 'assembleRelease') {
        task.doLast {
            copy {
                from "${buildDir}/outputs/apk"
                into "${rootDir}/download-page"
                include "**/*.apk"
                exclude "**/*androidTest*"
                rename { "ContactsBackup.apk" }
            }
            copy {
                from "${buildDir}/outputs/apk"
                into "${rootDir}/docs"
                include "**/*.apk"
                exclude "**/*androidTest*"
                rename { "ContactsBackup.apk" }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
